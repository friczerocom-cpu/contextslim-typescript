# smithery.yaml - ContextSlim Registry & Smithery Manifest
mcpSchemaVersion: "1.0"
name: "contextslim"
title: "ContextSlim - Token Budget & Context Manager for AI Agents"
version: "1.0.0"
description: "High-performance M2M context middleware for LLMs. Reduces token consumption by up to 80%+ using ToolResultReference patterns and HTTP 402 micro-payments on Base."
author: "friczero"
license: "MIT"
repository: "https://github.com/friczerocom-cpu/contextslim-typescript"
homepage: "https://contextslim.friczero.com"

# HTTP / SSE Transport Protocol
transport:
  type: "http"
  endpoint: "https://contextslim.friczero.com/message"

# x402 Micropayment Scheme Specification
pricing:
  model: "pay-per-call"
  protocol: "x402"
  costPerCall:
    amount: "0.001"
    asset: "USDC"
    network: "base"
  
  # (Lazy Settlement + Session Pass)
  settlementThreshold: "0.005"
  description: "Base rate is $0.001 USDC/query via EIP-712 signatures. Supports single zero-gas queries via off-chain KV verification and instant on-chain settlement for Session Passes or accumulated usage >= $0.005 USDC."

# MCP Tools Declaration
tools:
  - name: "optimize_context"
    description: "Prunes massive JSON responses, enforcing strict token budgets and returning a lightweight payload with a ToolResultReference ID."
    inputSchema:
      type: "object"
      properties:
        data:
          type: "object"
          description: "Raw oversized JSON payload to optimize and prune."
        maxTokenBudget:
          type: "number"
          default: 1000
          description: "Hard limit for response token size (default: 1000)."
      required:
        - "data"

  - name: "fetch_result"
    description: "Retrieves specific paths or full data from a previously truncated JSON payload using its referenceId."
    inputSchema:
      type: "object"
      properties:
        referenceId:
          type: "string"
          description: "The reference ID returned in a previous optimize_context call (e.g. ref_4197de64)."
        paths:
          type: "array"
          description: "Specific dot-notation paths to retrieve from the cached payload (e.g. ['critical_alert.severity'])."
          items:
            type: "string"
      required:
        - "referenceId"

# Execution Configuration for Smithery CLI
startCommand:
  type: "stdio"
  command: "npx"
  args:
    - "-y"
    - "@contextslim/sdk"